aid: ciq

name: CIQ

image: https://ciq.com/og-image.png

description: CIQ provides a sovereign AI infrastructure platform built on Rocky Linux, offering secure, scalable solutions for enterprises, research
  institutions, and government agencies. Their product suite includes Rocky Linux Pro, Fuzzball, Warewulf Pro, Ascender Pro, and CIQ Bridge, along
  with long‑term support and migration services. CIQ focuses on open‑source ethos and partnerships with NVIDIA, AMD, and others, delivering a
  full stack for AI at scale.

